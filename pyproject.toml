[build-system]
requires = ["setuptools >= 71.0.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Thousand Brains Project" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha", # Update this status as the code evolves
    "License :: OSI Approved :: MIT License",
    "Private :: Do Not Upload to PyPI", # Remove if you want to upload to PyPI
    "Programming Language :: Python :: 3",
]
dependencies = [
    "tbp.monty", # imported via conda
    "hydra-core>=1.3.2", # Hydra is used for configuring Monty
    "matplotlib>=3.7.3", # imported via conda
    "numpy", # imported via conda
    "numpy-quaternion", # imported via conda (conda-forge::quaternion)
    "opencv-python-headless==4.13.0.92", # see the `opencv-python` override below
    "typing-extensions",
]
description = "Visualize and teleoperate a Monty experiment in real-time "
dynamic = ["version"]
license = { file = "LICENSE" }
name = "tbp.teleop"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
# Forwards Monty's own simulator extra, so the simulator is installed alongside
# teleop. MuJoCo requires Python >= 3.9, i.e. the uv environment.
simulator_mujoco = [
    "tbp.monty[simulator_mujoco]",
]

# Interactive GUI backend (QtAgg) required by the live plotter. The conda
# environment gets this from conda-forge::pyqt instead.
gui = [
    "PyQt5",
]

dev = [
    # Check for undeclared dependencies
    "deptry",

    # Python static type checker
    "mypy==1.14.1",
    "types-PyYAML",

    # Testing, code style, etc...
    "pytest==7.1.1",
    "pytest-xdist==2.5.0",
    "pytest-cov==3.0.0",

    # Python linter and formatter
    "ruff==0.14.2",
]

[project.urls]
Repository = "https://github.com/thousandbrainsproject/tbp.teleop"
Issues = "https://github.com/thousandbrainsproject/tbp.teleop/issues"

[tool.uv]
# Monty depends on `opencv-python`, whose bundled Qt plugins overwrite
# QT_QPA_PLATFORM_PLUGIN_PATH on import and crash PyQt5's xcb plugin. The marker
# is never satisfied, which drops it in favor of the headless build declared
# above; `environment[_arm64].yml` does the same for the conda environment.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.sources]
# Monty is not published to PyPI; point at a local checkout. This is the uv
# counterpart to the `-e ../tbp.monty` entry in `environment[_arm64].yml`.
"tbp.monty" = { path = "../feat.comp_benefits_figures", editable = true }

[tool.uv.extra-build-dependencies]
# torch-scatter and torch-sparse are sdist-only and import torch while building.
torch-scatter = ["setuptools", "torch"]
torch-sparse = ["torch"]

[tool.deptry]
exclude = ["venv", "\\.venv", "\\.direnv", "\\.git", "setup\\.py"]
experimental_namespace_package = true # recognize `tbp.` prefixed packages as a namespace package
ignore = ["DEP002"]

[tool.deptry.package_module_name_map]
matplotlib = ["matplotlib", "mpl_toolkits"]
numpy-quaternion = ["quaternion"]


[tool.mypy]
explicit_package_bases = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
warn_unused_configs = true
strict = true

[[tool.mypy.overrides]]
module = ["tbp.monty.*", "matplotlib.*", "quaternion.*", "mpl_toolkits.*"]
ignore_missing_imports = true # Remove once tbp.monty types are published

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -n auto"
testpaths = ["tests/unit"]
filterwarnings = [
    "ignore:.*:DeprecationWarning",
]
junit_family = "xunit1"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
preview = true
explicit-preview-rules = true # comment this out to check all preview rules
select = [
    "ALL",
    # Explicitly opt-in to preview rules
    "CPY001", # Missing copyright notice at top of file
    "DOC201", # return is not documented in docstring
    "DOC202", # Docstring should not have a returns section because the function doesn't return anything
    "DOC402", # yield is not documented in docstring
    "DOC403", # Docstring has a "Yields" section but the function doesn't yield anything
    "DOC501", # Raised exception {id} missing from docstring
    "DOC502", # Raised exception is not explicitly raised: {id}
    "E261", # Insert at least two spaces before an inline comment
    "E262", # Inline comment should start with '# '
    "E265", # Block comment should start with '# '
]
ignore = [
    "COM812", # Trailing comma missing; conflicts with ruff format
    "ISC001", # Implicitly concatenated string literals on one line; conflicts with ruff format
    "PLR1711", # PLR1711: Useless `return` statement at end of function
    "RET501", # RET501: Do not explicitly `return None` in function if it is the only possible return value
]

[tool.ruff.lint.per-file-ignores]
# D104: Missing docstring in public package
"__init__.py" = ["D104"]
# D100: Missing docstring in public module
# D101: Missing docstring in public class
# D102: Missing docstring in public method
# S101: Use of `assert` detected
"tests/**.py" = ["D100", "D101", "D102", "S101"]

[tool.ruff.lint.flake8-copyright]
author = "Thousand Brains Project"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
